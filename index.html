<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✦ 幸運日記 2.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500&family=Zen+Kaku+Gothic+New:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #C9952A;
            --gold-light: #FFF3D6;
            --gold-mid: #E9A840;
            --bg: #FAFAF7;
            --surface: #FFFFFF;
            --border: rgba(0,0,0,0.08);
            --border-hover: rgba(0,0,0,0.16);
            --text-primary: #1A1A18;
            --text-secondary: #6B6B60;
            --text-muted: #A8A89A;
            --radius-md: 10px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Zen Kaku Gothic New', 'Noto Serif TC', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* ── LOGIN SCREEN ── */
        #loginScreen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: var(--bg);
            position: relative;
            overflow: hidden;
        }

        .login-inner { text-align: center; max-width: 360px; width: 100%; position: relative; z-index: 1; }
        .login-symbol { font-size: 48px; margin-bottom: 1.5rem; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .login-title { font-family: 'Noto Serif TC', serif; font-weight: 300; font-size: 32px; letter-spacing: 0.2em; margin-bottom: 0.5rem; }
        .login-sub { font-size: 14px; color: var(--text-secondary); line-height: 1.8; margin-bottom: 2.5rem; }

        .google-btn {
            display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 14px 24px;
            background: var(--surface); border: 1px solid var(--border-hover); border-radius: var(--radius-md);
            cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow-sm);
        }
        .google-btn:hover { box-shadow: var(--shadow-md); border-color: var(--gold); transform: translateY(-1px); }

        /* ── APP SCREEN ── */
        #appScreen { display: none; min-height: 100vh; }
        .app-header {
            background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 1.5rem;
            height: 60px; display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100;
        }
        .app-logo { font-family: 'Noto Serif TC', serif; font-weight: 300; font-size: 18px; letter-spacing: 0.15em; }
        .app-logo span { color: var(--gold); }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .user-avatar, .user-avatar-placeholder { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--gold-light); object-fit: cover; }
        .logout-btn { font-size: 12px; color: var(--text-muted); background: none; border: 1px solid var(--border); border-radius: 6px; padding: 5px 12px; cursor: pointer; }

        .main { max-width: 640px; margin: 0 auto; padding: 2rem 1.25rem 4rem; transition: max-width 0.2s; }

        /* ── STATS & STREAK ── */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.5rem; }
        .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 1rem; text-align: center; }
        .stat-num { font-size: 26px; font-weight: 500; display: block; margin-bottom: 4px; }
        .stat-lbl { font-size: 11px; color: var(--text-muted); letter-spacing: 0.06em; }

        .streak-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 1rem 1.25rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 12px; }
        .streak-dots { display: flex; gap: 6px; flex: 1; }
        .s-dot { flex: 1; height: 6px; border-radius: 3px; background: var(--border); }
        .s-dot.active { background: var(--gold-mid); }

        /* ── INPUT CARD ── */
        .input-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1.5rem; box-shadow: var(--shadow-sm); }
        .input-label { font-size: 11px; color: var(--text-muted); margin-bottom: 0.6rem; display: block; }
        textarea { width: 100%; border: none; outline: none; background: transparent; font-family: 'Noto Serif TC', serif; font-size: 15px; line-height: 1.85; resize: none; min-height: 88px; }
        
        .input-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 0.8rem; padding-top: 0.8rem; border-top: 1px solid var(--border); }
        
        /* Star Rating */
        .star-rating { display: flex; gap: 4px; }
        .star-btn { background: none; border: none; cursor: pointer; font-size: 20px; color: var(--border-hover); transition: color 0.2s; }
        .star-btn.active { color: var(--gold-mid); }
        .submit-btn { background: var(--text-primary); color: var(--bg); border: none; border-radius: var(--radius-md); padding: 9px 22px; font-size: 13px; cursor: pointer; }

        /* ── SEARCH ── */
        .search-box {
            display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-md); padding: 9px 14px; margin-bottom: 1.25rem; transition: border-color 0.2s;
        }
        .search-box:focus-within { border-color: var(--gold-mid); }
        .search-icon { font-size: 13px; color: var(--text-muted); flex-shrink: 0; }
        .search-box input { flex: 1; border: none; outline: none; background: transparent; font-size: 13.5px; font-family: 'Zen Kaku Gothic New', sans-serif; }
        .search-box input::placeholder { color: var(--text-muted); }
        .search-clear { display: none; align-items: center; justify-content: center; border: none; background: var(--border); color: var(--text-secondary); width: 20px; height: 20px; border-radius: 50%; cursor: pointer; font-size: 11px; flex-shrink: 0; }
        .search-clear:hover { background: var(--border-hover); }
        mark { background: var(--gold-light); color: inherit; border-radius: 3px; padding: 0 2px; }

        /* ── VIEW TOGGLE ── */
        .view-toggle { display: flex; gap: 8px; margin-bottom: 1.25rem; }
        .view-btn { font-size: 12px; padding: 6px 18px; border-radius: 20px; border: 1px solid var(--border); background: transparent; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .view-btn.active { background: var(--text-primary); color: var(--bg); border-color: var(--text-primary); }

        /* ── FILTER ── */
        .filter-row { display: flex; gap: 8px; margin-bottom: 1.25rem; }
        .filter-chip { font-size: 12px; padding: 5px 16px; border-radius: 20px; border: 1px solid var(--border); background: transparent; cursor: pointer; }
        .filter-chip.active { background: var(--text-primary); color: var(--bg); }

        /* ── ENTRIES ── */
        .entry-card { 
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.1rem 1.25rem; 
            position: relative; transition: all 0.2s; cursor: pointer; margin-bottom: 10px;
        }
        .entry-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--gold-mid); }
        .entry-header { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
        .entry-date { font-size: 11px; color: var(--text-muted); }
        .entry-stars { color: var(--gold-mid); font-size: 12px; }
        .entry-text { font-family: 'Noto Serif TC', serif; font-size: 14.5px; line-height: 1.85; white-space: pre-wrap; }
        .entry-delete { position: absolute; top: 10px; right: 10px; border: none; background: none; color: var(--text-muted); padding: 5px; cursor: pointer; opacity: 0; }
        .entry-card:hover .entry-delete { opacity: 1; }

        /* ── CALENDAR VIEW ── */
        .calendar-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1.5rem; box-shadow: var(--shadow-sm); }
        .calendar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.9rem; }
        .cal-nav-btn { background: none; border: 1px solid var(--border); border-radius: 8px; width: 30px; height: 30px; cursor: pointer; font-size: 15px; color: var(--text-secondary); }
        .cal-nav-btn:hover { border-color: var(--gold-mid); color: var(--gold-mid); }
        .calendar-month-label { font-family: 'Noto Serif TC', serif; font-size: 16px; letter-spacing: 0.06em; }
        .calendar-summary { font-size: 11px; color: var(--text-muted); text-align: center; margin-bottom: 0.9rem; letter-spacing: 0.03em; }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .cal-weekday { text-align: center; font-size: 11px; color: var(--text-muted); padding-bottom: 4px; }
        .cal-day {
            aspect-ratio: 1; border-radius: 10px; border: 1px solid var(--border); background: var(--bg);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; position: relative; font-size: 12.5px; transition: all 0.15s; gap: 2px;
        }
        .cal-day:hover { border-color: var(--gold-mid); }
        .cal-day.empty { visibility: hidden; cursor: default; }
        .cal-day.has-entry { background: var(--gold-light); border-color: var(--gold-mid); font-weight: 500; }
        .cal-day.today { box-shadow: 0 0 0 2px var(--gold-mid) inset; }
        .cal-day.selected { background: var(--text-primary); border-color: var(--text-primary); color: var(--bg); }
        .cal-day-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--gold-mid); }
        .cal-day.selected .cal-day-dot { background: var(--bg); }

        .day-entries-section { margin-top: 1.5rem; }
        .day-entries-title { font-size: 11px; color: var(--text-muted); margin-bottom: 0.7rem; letter-spacing: 0.04em; }
        .day-entries-empty { text-align: center; padding: 2rem 1rem; color: var(--text-muted); font-size: 13px; }

        /* ── MODAL ── */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 1000;
            backdrop-filter: blur(4px);
        }
        .modal-content { 
            background: var(--surface); width: 90%; max-width: 500px; border-radius: var(--radius-lg); padding: 2rem;
            box-shadow: var(--shadow-md); position: relative;
        }
        .modal-close { position: absolute; top: 1rem; right: 1rem; cursor: pointer; font-size: 20px; color: var(--text-muted); }

        .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--text-primary); color: var(--bg); padding: 11px 24px; border-radius: var(--radius-md); font-size: 13px; transition: transform 0.3s; z-index: 2000; }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* ── MAIN TABS ── */
        .main-tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; margin: 0 auto 1.75rem; max-width: 320px; }
        .main-tab { flex: 1; text-align: center; font-size: 13px; padding: 9px 12px; border-radius: 999px; border: none; background: transparent; color: var(--text-secondary); cursor: pointer; transition: all 0.2s; font-family: inherit; }
        .main-tab.active { background: var(--text-primary); color: var(--bg); }

        /* ── CATEGORIES (謝謝日記) ── */
        .category-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1.25rem; }
        .category-chip { font-size: 12px; padding: 5px 16px; border-radius: 20px; border: 1px solid var(--border); background: transparent; cursor: pointer; color: var(--text-secondary); }
        .category-chip.active { background: var(--text-primary); color: var(--bg); border-color: var(--text-primary); }
        .category-chip-add, .category-pick-add { font-size: 12px; padding: 5px 14px; border-radius: 20px; border: 1px dashed var(--border-hover); background: transparent; cursor: pointer; color: var(--text-muted); }
        .category-chip-add:hover, .category-pick-add:hover { border-color: var(--gold-mid); color: var(--gold-mid); }

        .category-picker { display: flex; flex-wrap: wrap; gap: 6px; }
        .category-pick-btn { font-size: 11.5px; padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); background: transparent; cursor: pointer; color: var(--text-secondary); transition: all 0.15s; }

        .thanks-input-footer { margin-top: 0.8rem; padding-top: 0.8rem; border-top: 1px solid var(--border); }
        .thanks-input-footer .category-picker { margin-bottom: 0.8rem; }
        .thanks-submit-row { display: flex; justify-content: flex-end; }

        .cat-badge { font-size: 10.5px; padding: 2px 10px; border-radius: 20px; color: #fff; white-space: nowrap; }

        /* ── DESKTOP: 橫向展開 ── */
        @media (min-width: 900px) {
            .main { max-width: 1080px; padding: 2.5rem 2rem 5rem; }
            .stats-grid { gap: 16px; }
            .stat-card { padding: 1.25rem; }
            .stat-num { font-size: 30px; }

            /* 列表模式：雙欄排列 entries，讓橫向空間更有效利用 */
            #entriesContainer, #thanksEntriesContainer, .day-entries-list {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
                align-items: start;
            }
            #entriesContainer .entry-card, #thanksEntriesContainer .entry-card, .day-entries-list .entry-card { margin-bottom: 0; }

            /* 日曆模式：日曆置左、當日紀錄置右，並排顯示 */
            .calendar-layout { display: grid; grid-template-columns: 380px 1fr; gap: 1.5rem; align-items: start; }
            .day-entries-section { margin-top: 0; }
            .cal-day { font-size: 13px; }
        }
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="login-inner">
        <div class="login-symbol">✦</div>
        <h1 class="login-title">幸運日記</h1>
        <p class="login-sub">記下每一個小確幸<br>讓幸運持續發生</p>
        <button class="google-btn" onclick="signInWithGoogle()">使用 Google 帳號登入</button>
    </div>
</div>

<div id="appScreen">
    <header class="app-header">
        <div class="app-logo">✦ <span>幸運</span>日記</div>
        <div class="header-right">
            <div id="userAvatar"></div>
            <button class="logout-btn" onclick="signOut()">登出</button>
        </div>
    </header>

    <main class="main">
        <div class="main-tabs">
            <button class="main-tab active" id="tabBtnLucky" onclick="setMainTab('lucky', this)">✦ 幸運日記</button>
            <button class="main-tab" id="tabBtnThanks" onclick="setMainTab('thanks', this)">🙏 謝謝日記</button>
        </div>

        <div id="luckyPage">
        <div class="stats-grid">
            <div class="stat-card"><span class="stat-num" id="statTotal">—</span><span class="stat-lbl">總幸運數</span></div>
            <div class="stat-card"><span class="stat-num" id="statStreak">—</span><span class="stat-lbl">連續天數</span></div>
            <div class="stat-card"><span class="stat-num" id="statMonth">—</span><span class="stat-lbl">本月幸運</span></div>
        </div>

        <div class="streak-section">
            <div class="streak-dots" id="streakDots"></div>
            <span class="streak-days" id="streakDaysText">0 天</span>
        </div>

        <div class="input-card">
            <span class="input-label">今天的小幸運是什麼？</span>
            <textarea id="luckyInput" placeholder="寫下值得感謝的一刻..." rows="3"></textarea>
            <div class="input-footer">
                <div class="star-rating" id="starInput">
                    <button class="star-btn active" data-val="1">⭐</button>
                    <button class="star-btn" data-val="2">⭐</button>
                    <button class="star-btn" data-val="3">⭐</button>
                    <button class="star-btn" data-val="4">⭐</button>
                    <button class="star-btn" data-val="5">⭐</button>
                </div>
                <button class="submit-btn" id="submitBtn" onclick="addEntry()">記下來 →</button>
            </div>
        </div>

        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="搜尋關鍵字...（例如：貓咪、下雨、朋友）" oninput="setSearch(this.value)">
            <button class="search-clear" id="searchClearBtn" onclick="clearSearch()">✕</button>
        </div>

        <div class="view-toggle">
            <button class="view-btn active" id="viewBtnList" onclick="setView('list', this)">📋 全覽模式</button>
            <button class="view-btn" id="viewBtnCalendar" onclick="setView('calendar', this)">📅 日曆模式</button>
        </div>

        <!-- ── 全覽模式 ── -->
        <div id="listView">
            <div class="filter-row">
                <button class="filter-chip active" onclick="setFilter('all',this)">全部</button>
                <button class="filter-chip" onclick="setFilter('today',this)">今天</button>
                <button class="filter-chip" onclick="setFilter('month',this)">本月</button>
            </div>
            <div id="entriesContainer"></div>
        </div>

        <!-- ── 日曆模式 ── -->
        <div id="calendarView" style="display:none;">
            <div class="calendar-layout">
                <div class="calendar-card">
                    <div class="calendar-header">
                        <button class="cal-nav-btn" onclick="changeMonth(-1)">‹</button>
                        <span class="calendar-month-label" id="calendarMonthLabel"></span>
                        <button class="cal-nav-btn" onclick="changeMonth(1)">›</button>
                    </div>
                    <div class="calendar-summary" id="calendarSummary"></div>
                    <div class="calendar-grid" id="calendarGrid"></div>
                </div>
                <div class="day-entries-section" id="calendarDayEntries"></div>
            </div>
        </div>
        </div>
        <!-- /#luckyPage -->

        <!-- ══════════════ 謝謝日記 ══════════════ -->
        <div id="thanksPage" style="display:none;">
            <div class="stats-grid">
                <div class="stat-card"><span class="stat-num" id="thanksStatTotal">—</span><span class="stat-lbl">總篇數</span></div>
                <div class="stat-card"><span class="stat-num" id="thanksStatStreak">—</span><span class="stat-lbl">記錄天數</span></div>
                <div class="stat-card"><span class="stat-num" id="thanksStatMonth">—</span><span class="stat-lbl">本月篇數</span></div>
            </div>

            <div class="input-card">
                <span class="input-label">今天想謝謝誰、謝謝什麼？</span>
                <textarea id="thanksInput" placeholder="寫下心裡的感謝..." rows="3"></textarea>
                <div class="thanks-input-footer">
                    <div class="category-picker" id="thanksCategoryPicker"></div>
                    <div class="thanks-submit-row">
                        <button class="submit-btn" id="thanksSubmitBtn" onclick="addThanksEntry()">記下來 →</button>
                    </div>
                </div>
            </div>

            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="thanksSearchInput" placeholder="搜尋關鍵字..." oninput="setThanksSearch(this.value)">
                <button class="search-clear" id="thanksSearchClearBtn" onclick="clearThanksSearch()">✕</button>
            </div>

            <div class="view-toggle">
                <button class="view-btn active" id="thanksViewBtnList" onclick="setThanksView('list', this)">📋 全覽模式</button>
                <button class="view-btn" id="thanksViewBtnCalendar" onclick="setThanksView('calendar', this)">📅 日曆模式</button>
            </div>

            <div class="category-row" id="thanksCategoryFilterRow"></div>

            <!-- ── 全覽模式 ── -->
            <div id="thanksListView">
                <div id="thanksEntriesContainer"></div>
            </div>

            <!-- ── 日曆模式 ── -->
            <div id="thanksCalendarView" style="display:none;">
                <div class="calendar-layout">
                    <div class="calendar-card">
                        <div class="calendar-header">
                            <button class="cal-nav-btn" onclick="changeThanksMonth(-1)">‹</button>
                            <span class="calendar-month-label" id="thanksCalendarMonthLabel"></span>
                            <button class="cal-nav-btn" onclick="changeThanksMonth(1)">›</button>
                        </div>
                        <div class="calendar-summary" id="thanksCalendarSummary"></div>
                        <div class="calendar-grid" id="thanksCalendarGrid"></div>
                    </div>
                    <div class="day-entries-section" id="thanksCalendarDayEntries"></div>
                </div>
            </div>
        </div>
        <!-- /#thanksPage -->
    </main>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
    <div class="modal-content">
        <span class="modal-close" onclick="closeEditModal()">✕</span>
        <h3 style="margin-bottom: 1rem; font-weight: 400;">編輯這份幸運</h3>
        <div class="star-rating" id="editStarInput" style="margin-bottom: 1rem;">
            <button class="star-btn" data-val="1">⭐</button>
            <button class="star-btn" data-val="2">⭐</button>
            <button class="star-btn" data-val="3">⭐</button>
            <button class="star-btn" data-val="4">⭐</button>
            <button class="star-btn" data-val="5">⭐</button>
        </div>
        <textarea id="editLuckyInput" style="border: 1px solid var(--border); padding: 10px; border-radius: 8px; min-height: 150px;"></textarea>
        <button class="submit-btn" style="width: 100%; margin-top: 1rem;" onclick="saveEdit()">儲存變更</button>
    </div>
</div>

<!-- Edit Modal (謝謝日記) -->
<div class="modal-overlay" id="editThanksModal">
    <div class="modal-content">
        <span class="modal-close" onclick="closeEditThanksModal()">✕</span>
        <h3 style="margin-bottom: 1rem; font-weight: 400;">編輯這份感謝</h3>
        <div class="category-picker" id="editThanksCategoryPicker" style="margin-bottom: 1rem;"></div>
        <textarea id="editThanksInput" style="border: 1px solid var(--border); padding: 10px; border-radius: 8px; min-height: 150px;"></textarea>
        <button class="submit-btn" style="width: 100%; margin-top: 1rem;" onclick="saveThanksEdit()">儲存變更</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut as fbSignOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

const CATEGORY_COLORS = ['#C9952A', '#8E7CC3', '#5B9BD5', '#68A67B', '#D97757', '#B15C6B', '#4E8098', '#9C7A46', '#C77DAB', '#7A8C5A'];
function getCategoryColor(name) {
    let hash = 0;
    for (let i = 0; i < (name || '').length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return CATEGORY_COLORS[Math.abs(hash) % CATEGORY_COLORS.length];
}

function escapeRegExp(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function highlightText(text, q) {
    if (!q) return text;
    const re = new RegExp(`(${escapeRegExp(q)})`, 'gi');
    return text.replace(re, '<mark>$1</mark>');
}

function matchesSearch(e) {
    if (!searchQuery) return true;
    return (e.text || '').toLowerCase().includes(searchQuery.toLowerCase());
}

// ── Render (List) ──
function render() {
    const filtered = allEntries.filter(e => {
        const d = e.createdAt?.toDate?.() || new Date();
        const now = new Date();
        if (!matchesSearch(e)) return false;
        if (currentFilter === 'today') return d.toDateString() === now.toDateString();
        if (currentFilter === 'month') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
        return true;
    });

    const container = document.getElementById('entriesContainer');
    if (!filtered.length) {
        const msg = searchQuery ? `找不到包含「${searchQuery}」的紀錄` : '尚無幸運紀錄';
        container.innerHTML = `<div style="text-align:center; padding: 3rem; color: #A8A89A;">${msg}</div>`;
    } else {
        container.innerHTML = filtered.map(e => {
            const d = e.createdAt?.toDate?.() || new Date();
            const dateStr = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
            const starStr = '⭐'.repeat(e.stars || 1);
            return `
            <div class="entry-card" onclick="openEditModal('${e.id}')">
                <button class="entry-delete" onclick="deleteEntry(event, '${e.id}')">✕</button>
                <div class="entry-header">
                    <span class="entry-date">${dateStr}</span>
                    <span class="entry-stars">${starStr}</span>
                </div>
                <div class="entry-text">${highlightText(e.text, searchQuery)}</div>
            </div>`;
        }).join('');
    }
    updateStats();
    if (currentView === 'calendar') renderCalendar();
}

function updateStats() {
    document.getElementById('statTotal').textContent = allEntries.length;
    // 簡單的天數計算
    const days = new Set(allEntries.map(e => (e.createdAt?.toDate?.() || new Date()).toDateString()));
    document.getElementById('statStreak').textContent = days.size;

    const now = new Date();
    const monthCount = allEntries.filter(e => {
        const d = e.createdAt?.toDate?.() || new Date();
        return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    }).length;
    document.getElementById('statMonth').textContent = monthCount;

    // Streak dots
    const dots = [];
    for(let i=13; i>=0; i--) {
        const d = new Date(); d.setDate(d.getDate()-i);
        const active = days.has(d.toDateString()) ? 'active' : '';
        dots.push(`<div class="s-dot ${active}"></div>`);
    }
    document.getElementById('streakDots').innerHTML = dots.join('');
    document.getElementById('streakDaysText').textContent = `${days.size} 天`;
}

// ── Calendar View ──
function dateKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

window.changeMonth = (delta) => {
    calMonth += delta;
    if (calMonth < 0) { calMonth = 11; calYear--; }
    if (calMonth > 11) { calMonth = 0; calYear++; }
    selectedDate = null;
    renderCalendar();
};

function renderCalendar() {
    document.getElementById('calendarMonthLabel').textContent = `${calYear} 年 ${calMonth + 1} 月`;

    // 依日期分組（若有搜尋關鍵字，只納入符合的紀錄）
    const map = {};
    allEntries.forEach(e => {
        if (!matchesSearch(e)) return;
        const d = e.createdAt?.toDate?.() || new Date();
        const key = dateKey(d);
        if (!map[key]) map[key] = [];
        map[key].push(e);
    });

    const firstDayWeekday = new Date(calYear, calMonth, 1).getDay();
    const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    const todayKey = dateKey(new Date());
    const monthPrefix = `${calYear}-${String(calMonth + 1).padStart(2, '0')}`;

    let html = ['日','一','二','三','四','五','六'].map(w => `<div class="cal-weekday">${w}</div>`).join('');
    for (let i = 0; i < firstDayWeekday; i++) html += `<div class="cal-day empty"></div>`;

    let recordedDays = 0;
    for (let d = 1; d <= daysInMonth; d++) {
        const key = `${monthPrefix}-${String(d).padStart(2, '0')}`;
        const hasEntry = !!map[key];
        if (hasEntry) recordedDays++;
        let cls = 'cal-day';
        if (hasEntry) cls += ' has-entry';
        if (key === todayKey) cls += ' today';
        if (key === selectedDate) cls += ' selected';
        html += `<div class="${cls}" onclick="selectCalDay('${key}')">
            <span>${d}</span>
            ${hasEntry ? `<span class="cal-day-dot"></span>` : ''}
        </div>`;
    }

    document.getElementById('calendarGrid').innerHTML = html;
    const summaryText = searchQuery
        ? `包含「${searchQuery}」：本月 ${recordedDays} 天`
        : `本月已記錄 ${recordedDays} / ${daysInMonth} 天`;
    document.getElementById('calendarSummary').textContent = summaryText;
    renderSelectedDayEntries(map);
}

window.selectCalDay = (key) => {
    selectedDate = (selectedDate === key) ? null : key;
    renderCalendar();
};

function renderSelectedDayEntries(map) {
    const container = document.getElementById('calendarDayEntries');
    if (!selectedDate) {
        container.innerHTML = `<div class="day-entries-empty">點選左側日期，查看當天的幸運紀錄 ✦</div>`;
        return;
    }
    const [y, m, d] = selectedDate.split('-');
    const entries = map[selectedDate] || [];
    if (!entries.length) {
        container.innerHTML = `<div class="day-entries-title">${y}/${m}/${d}</div><div class="day-entries-empty">這天還沒有紀錄</div>`;
        return;
    }
    const list = entries.map(e => {
        const starStr = '⭐'.repeat(e.stars || 1);
        return `
        <div class="entry-card" onclick="openEditModal('${e.id}')">
            <button class="entry-delete" onclick="deleteEntry(event, '${e.id}')">✕</button>
            <div class="entry-header">
                <span class="entry-date">${y}/${m}/${d}</span>
                <span class="entry-stars">${starStr}</span>
            </div>
            <div class="entry-text">${highlightText(e.text, searchQuery)}</div>
        </div>`;
    }).join('');
    container.innerHTML = `<div class="day-entries-title">${y}/${m}/${d} · 共 ${entries.length} 則</div><div class="day-entries-list">${list}</div>`;
}

// ── Stars UI ──
function initStars(containerId, isEdit = false) {
    document.getElementById(containerId).addEventListener('click', e => {
        const btn = e.target.closest('.star-btn');
        if (!btn) return;
        const val = parseInt(btn.dataset.val);
        if (isEdit) editStars = val; else currentStars = val;
        updateStarUI(containerId, val);
    });
}

function updateStarUI(id, val) {
    const btns = document.querySelectorAll(`#${id} .star-btn`);
    btns.forEach(b => {
        if (parseInt(b.dataset.val) <= val) b.classList.add('active');
        else b.classList.remove('active');
    });
}

function showToast(m) {
    const t = document.getElementById('toast');
    t.textContent = m; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);

// ── 分類：與 Firestore 同步 ──
function listenThanksCategories() {
    const ref = doc(db, 'users', currentUser.uid, 'meta', 'thanksCategories');
    onSnapshot(ref, snap => {
        if (snap.exists() && Array.isArray(snap.data().list) && snap.data().list.length) {
            thanksCategories = snap.data().list;
        } else {
            // 第一次使用，寫入預設分類
            setDoc(ref, { list: thanksCategories }, { merge: true });
        }
        if (!thanksCategories.includes(currentThanksCategory)) currentThanksCategory = thanksCategories[0];
        if (editingThanksId && !thanksCategories.includes(editThanksCategory)) editThanksCategory = thanksCategories[0];
        renderThanksCategoryUI();
        renderThanks();
    });
}

window.addThanksCategory = async () => {
    const name = prompt('新增分類名稱（例如：朋友、工作、健康）：');
    if (name === null) return;
    const trimmed = name.trim();
    if (!trimmed) return;
    if (thanksCategories.includes(trimmed)) return showToast('這個分類已經存在囉');
    const ref = doc(db, 'users', currentUser.uid, 'meta', 'thanksCategories');
    await setDoc(ref, { list: arrayUnion(trimmed) }, { merge: true });
    showToast(`已新增分類「${trimmed}」`);
};

function categoryPickerHtml(selectedCat, onClickFnName) {
    const buttons = thanksCategories.map(cat => {
        const active = cat === selectedCat;
        const color = getCategoryColor(cat);
        const style = active ? ` style="background:${color};border-color:${color};color:#fff;"` : '';
        return `<button type="button" class="category-pick-btn${active ? ' active' : ''}"${style} onclick="${onClickFnName}('${cat.replace(/'/g, "\\'")}')">${cat}</button>`;
    }).join('');
    return buttons + `<button type="button" class="category-pick-add" onclick="addThanksCategory()">+ 新增</button>`;
}

function renderThanksCategoryUI() {
    renderThanksCategoryFilterRow();
    renderThanksCategoryPicker();
}

function renderThanksCategoryFilterRow() {
    const row = document.getElementById('thanksCategoryFilterRow');
    if (!row) return;
    let html = `<button class="category-chip${currentThanksCategoryFilter === 'all' ? ' active' : ''}" onclick="setThanksCategoryFilter('all', this)">全部</button>`;
    html += thanksCategories.map(cat =>
        `<button class="category-chip${currentThanksCategoryFilter === cat ? ' active' : ''}" onclick="setThanksCategoryFilter('${cat.replace(/'/g, "\\'")}', this)">${cat}</button>`
    ).join('');
    html += `<button class="category-chip-add" onclick="addThanksCategory()">+ 新增分類</button>`;
    row.innerHTML = html;
}

function renderThanksCategoryPicker() {
    const el = document.getElementById('thanksCategoryPicker');
    if (el) el.innerHTML = categoryPickerHtml(currentThanksCategory, 'selectThanksCategory');
}

function renderEditThanksCategoryPicker() {
    const el = document.getElementById('editThanksCategoryPicker');

function matchesThanksSearch(e) {

// ── Render (List) ──
function thanksEntryCardHtml(e) {
    const d = e.createdAt?.toDate?.() || new Date();
    const dateStr = `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
    const color = getCategoryColor(e.category || '');
    return `
    <div class="entry-card" onclick="openEditThanksModal('${e.id}')">
        <button class="entry-delete" onclick="deleteThanksEntry(event, '${e.id}')">✕</button>
        <div class="entry-header">
            <span class="entry-date">${dateStr}</span>
            <span class="cat-badge" style="background:${color};">${e.category || ''}</span>
        </div>
        <div class="entry-text">${highlightText(e.text, thanksSearchQuery)}</div>
    </div>`;

function renderThanks() {
    if (!currentUser) return;
    renderThanksCategoryFilterRow();

    const filtered = thanksEntries.filter(e => matchesThanksSearch(e) && matchesThanksCategoryFilter(e));
    const container = document.getElementById('thanksEntriesContainer');
    if (container) {
        if (!filtered.length) {
            const msg = thanksSearchQuery ? `找不到包含「${thanksSearchQuery}」的紀錄` : '尚無感謝紀錄';
            container.innerHTML = `<div style="text-align:center; padding: 3rem; color: #A8A89A;">${msg}</div>`;
        } else {
            container.innerHTML = filtered.map(e => thanksEntryCardHtml(e)).join('');
        }
    }
    updateThanksStats();
    if (thanksView === 'calendar') renderThanksCalendar();
}

function updateThanksStats() {
    const totalEl = document.getElementById('thanksStatTotal');
    if (!totalEl) return;
    totalEl.textContent = thanksEntries.length;

    const days = new Set(thanksEntries.map(e => (e.createdAt?.toDate?.() || new Date()).toDateString()));
    document.getElementById('thanksStatStreak').textContent = days.size;

    const now = new Date();
    const monthCount = thanksEntries.filter(e => {
        const d = e.createdAt?.toDate?.() || new Date();
        return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    }).length;
    document.getElementById('thanksStatMonth').textContent = monthCount;
}

window.changeThanksMonth = (delta) => {
    thanksCalMonth += delta;
    if (thanksCalMonth < 0) { thanksCalMonth = 11; thanksCalYear--; }
    if (thanksCalMonth > 11) { thanksCalMonth = 0; thanksCalYear++; }
    thanksSelectedDate = null;
    renderThanksCalendar();
};

function renderThanksCalendar() {
    const label = document.getElementById('thanksCalendarMonthLabel');
    if (!label) return;
    label.textContent = `${thanksCalYear} 年 ${thanksCalMonth + 1} 月`;

    const map = {};
    thanksEntries.forEach(e => {
        if (!matchesThanksSearch(e) || !matchesThanksCategoryFilter(e)) return;
        const d = e.createdAt?.toDate?.() || new Date();
        const key = dateKey(d);
        if (!map[key]) map[key] = [];
        map[key].push(e);
    });

    const firstDayWeekday = new Date(thanksCalYear, thanksCalMonth, 1).getDay();
    const daysInMonth = new Date(thanksCalYear, thanksCalMonth + 1, 0).getDate();
    const todayKey = dateKey(new Date());
    const monthPrefix = `${thanksCalYear}-${String(thanksCalMonth + 1).padStart(2, '0')}`;

    let html = ['日', '一', '二', '三', '四', '五', '六'].map(w => `<div class="cal-weekday">${w}</div>`).join('');
    for (let i = 0; i < firstDayWeekday; i++) html += `<div class="cal-day empty"></div>`;

    let recordedDays = 0;
    for (let d = 1; d <= daysInMonth; d++) {
        const key = `${monthPrefix}-${String(d).padStart(2, '0')}`;
        const hasEntry = !!map[key];
        if (hasEntry) recordedDays++;
        let cls = 'cal-day';
        if (hasEntry) cls += ' has-entry';
        if (key === todayKey) cls += ' today';
        if (key === thanksSelectedDate) cls += ' selected';
        html += `<div class="${cls}" onclick="selectThanksCalDay('${key}')">
            <span>${d}</span>
            ${hasEntry ? `<span class="cal-day-dot"></span>` : ''}
        </div>`;
    }

    document.getElementById('thanksCalendarGrid').innerHTML = html;
    const summaryText = (thanksSearchQuery || currentThanksCategoryFilter !== 'all')
        ? `符合條件：本月 ${recordedDays} 天`
        : `本月已記錄 ${recordedDays} / ${daysInMonth} 天`;
    document.getElementById('thanksCalendarSummary').textContent = summaryText;
    renderThanksSelectedDayEntries(map);
}

window.selectThanksCalDay = (key) => {
    thanksSelectedDate = (thanksSelectedDate === key) ? null : key;
    renderThanksCalendar();
};

function renderThanksSelectedDayEntries(map) {
    const container = document.getElementById('thanksCalendarDayEntries');
    if (!thanksSelectedDate) {
        container.innerHTML = `<div class="day-entries-empty">點選左側日期，查看當天的感謝紀錄 🙏</div>`;
        return;
    }
    const [y, m, d] = thanksSelectedDate.split('-');
    const entries = map[thanksSelectedDate] || [];
    if (!entries.length) {
        container.innerHTML = `<div class="day-entries-title">${y}/${m}/${d}</div><div class="day-entries-empty">這天還沒有紀錄</div>`;
        return;
    }
    const list = entries.map(e => thanksEntryCardHtml(e)).join('');
    container.innerHTML = `<div class="day-entries-title">${y}/${m}/${d} · 共 ${entries.length} 則</div><div class="day-entries-list">${list}</div>`;
}
</script>
</body>
</html>
